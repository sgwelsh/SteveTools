<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Order Form Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .pdf-button {
            background-color: #4285f4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .pdf-button:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>
    <h1>Work Order Form</h1>
    <p>Click the button below to open the fillable work order form:</p>
    <button class="pdf-button" onclick="openPDF()">Open Work Order Form</button>
    
    <script>
        function openPDF() {
            // Open in a new window/tab - this is the key to display rather than download
            const pdfURL = 'https://raw.githubusercontent.com/sgwelsh/SteveTools/main/Blank%20Work%20Order%20Copy.pdf';
            window.open(pdfURL, '_blank');
        }
    </script>
</body>
</html>
